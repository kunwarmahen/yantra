# A worked agent package. Run it from the repo root:
#
#   yantra --agent examples/agents/researcher "what does notes/30 say about allowed-tools?"
#   yantra --agent examples/agents/researcher --provider ollama     # your own hardware
#
# And to check it still works before you trust it with anything:
#
#   yantra --agent examples/agents/researcher --eval
#
# evals/cases.toml is this package's acceptance gate -- the behaviors this
# package promises, graded against this file's own prompt and tool list,
# exit non-zero if any of them has stopped being true (notes/33). One of
# its cases asserts the [tools] list below rather than a behavior, which
# costs no tokens and goes red the moment somebody adds write_file to it
# (notes/35).
#
# Every key below is optional. What is NOT here is as deliberate as what
# is: no provider and no model, so this package runs against whatever you
# already have -- a cloud key or a local server -- with no edit from you.

[agent]
name = "researcher"
description = "Reads sources in the working directory and answers with citations."
version = "0.1.0"
# prompt.md is picked up by convention; the key exists for other layouts.

# sources/ is not a key and not a convention -- it is just a folder this
# example ships, holding one long document for the agent to actually do
# its job on. A package with nothing to research but its own config is a
# demo; this one has a 217-line reference with thirty headings in it,
# which is what makes "outline before you read" worth obeying and what
# the eval case measures.

[model]
# A research turn reads a lot of files before it answers.
max_iterations = 20

[tools]
# A COMPLETE whitelist: reading, searching, fetching, and the two tools
# that make a long job legible. Note what is absent -- no bash, no
# write_file, no edit_file. This agent answers questions; it does not
# change your working tree, and the admission policy means it cannot,
# even if a prompt talks it into trying.
#
# load_skill has to be here, or the skill below would be listed in the
# prompt with no way to open it (the loader refuses that package outright).
# run_skill is its sibling, for skills that run in a sub-agent rather than
# inline -- leave it out and a delegated skill has nowhere to run.
#
# "outline" is this package's OWN tool (tools/outline.py). A package tool
# goes through the same admission policy as a built-in, so it has to be
# named here like everything else -- leave it out and startup prints
# "package excludes: outline" rather than quietly shipping it.
allow = [
    "read_file", "list_dir", "glob", "grep",
    "web_fetch",
    "outline",
    "load_skill", "run_skill",
    "todo_read", "todo_write",
    # A declared sub-agent is a tool like any other, so it goes through
    # the same policy -- leave it out and startup prints
    # "package excludes: fact_checker" rather than shipping it quietly.
    "fact_checker",
]

# tools/ is picked up because it exists; the key is for other layouts:
#   dirs = ["tools", "../shared-tools"]
# Loading these RUNS THEIR PYTHON as you, before any permission gate --
# read a package's tools/ before you run it, the same way you would read
# a dependency you are about to install (notes/32).

# A sub-agent this package DECLARES. It is not spawn_subagent: the model
# does not choose this child's tools, its instructions or its iteration
# cap -- they are in this file, in a diff somebody could review, and the
# model supplies one string (the claim to check).
#
# What it buys is a FRESH CONTEXT WINDOW. Checking a claim means reading
# files that are of no further interest once the answer is known, and
# doing that inline drags the whole search into the conversation the
# parent still has to finish. The parent gets back a verdict and a quote.
#
# One level deep, always: a sub-agent cannot be given another sub-agent,
# and the loader refuses a manifest that tries (notes/40).
[[subagent]]
name = "fact_checker"
description = """
Check one factual claim against the files in the working directory. Give it the claim in a single sentence; it returns a verdict and a quote with a file and line.
"""
prompt = "subagents/fact_checker.md"
# NARROWER THAN THE PARENT, on purpose. No web_fetch: checking a claim
# against the sources in front of you is a different job from going and
# finding new ones, and a checker that can wander onto the internet is a
# checker that comes back with something nobody cited.
tools = ["read_file", "glob", "grep", "outline"]
# Checking is short work. A child still looking after twelve rounds has
# not found the file and is not about to.
max_iterations = 12
output_format = """
One line: SUPPORTED / CONTRADICTED / UNSUPPORTED, then the quote with its file and line, then one sentence of reasoning.
"""
# model = "..."  -- a cheaper slug ON THE PARENT'S PROVIDER, if you want
# the grunt work done somewhere else. Left unset so this package still
# runs against whatever you have, which is the rule the rest of the file
# follows too.

[budget]
# A turn here reads a handful of files and answers. Fifty cents is loose
# enough that an honest research turn never notices it, and tight enough
# that a loop -- fetch, re-read, fetch the same page again -- stops
# instead of running to the iteration cap above with a full context
# billed every round (notes/34). You get one heads-up before it fires,
# priced from the request the agent is about to send (notes/36).
#
# Read this before copying the key into a package you intend to SHARE:
# a ceiling needs a price, so this package now refuses to run against a
# metered model that yantra has no list price for. Local models are fine
# (they bill nothing, and the ceiling says on screen that it is inert);
# a gateway slug needs an entry in $YANTRA_PRICES. The cost of the key is
# paid by whoever runs your package, not by you.
max_usd_per_turn = 0.50

[permissions]
# web_fetch is network egress, so it asks before reaching out. Nothing
# else here can do damage -- every other tool is read-only and
# auto-approves.
mode = "ask"

[env]
# Machine facts without the location lookup: a research agent benefits
# from knowing the OS and the working directory, and not from the rest.
context = "local"
